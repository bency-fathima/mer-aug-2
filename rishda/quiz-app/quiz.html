<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        #quiz {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        #title {
            font-size: 46px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #173B57;
            margin-bottom: 35px;
        }

        #startbtn,
        #restartbtn {
            display: block;
            width: 170px;
            margin: 20px auto 0;
            background-color: #173B57;
            color: white;
            border: none;
            font-size: 18px;
            padding: 13px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        #startbtn {
            margin: 0 auto;
            padding: 15px 20px;
            box-shadow: 0 4px 12px rgba(23, 59, 87, 0.2);
        }

        #startbtn:hover,
        #restartbtn:hover {
            background-color: #245879;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(23, 59, 87, 0.25);
        }

        #question {
            font-size: 22px;
            line-height: 1.5;
            color: #263746;
            margin: 25px 0;
            min-height: 66px;
        }

        #options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .option-btn {
            width: calc(50% - 5px);
            min-height: 65px;
            padding: 12px;
            font-size: 16px;
            background-color: #173B57;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .option-btn:hover {
            background-color: #245879;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        #nextbtn {
            display: block;
            width: 90px;
            height: 40px;
            margin: 25px auto 0;
            background-color: #95a7bb;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #nextbtn:hover {
            background-color: #71869f;
        }

        #score {
            font-size: 24px;
            font-weight: 600;
            color: #173B57;
            background-color: #ffffff;
            padding: 20px 30px;
            width: 250px;
            margin: 25px auto;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #dce5ec;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>

<body>

    <div id="quiz">
        <h2 id="title">Quiz App</h2>
        <button id="startbtn">Start Quiz</button>
        <p id="question"></p>
        <div id="options"></div>
        <button id="nextbtn">Next</button>
        <div id="score"></div>
        <button id="restartbtn">Restart Quiz</button>
    </div>

    <script src="quiz.js"></script>

</body>

</html>
